server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — SPA fallback in case client-side routing is added later
    location / {
        try_files $uri /index.html;
    }

    # Proxmox API — forwarded internally to the proxy container
    location /proxmox/ {
        proxy_pass http://proxy:3001/proxmox/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Zabbix JSON-RPC — forwarded internally to the proxy container
    location /zabbix {
        proxy_pass http://proxy:3001/zabbix;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy health check, reachable through the same origin
    location /health {
        proxy_pass http://proxy:3001/health;
    }
}