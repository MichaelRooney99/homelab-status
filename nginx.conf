server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — SPA fallback in case client-side routing is added
    # later. $uri/ is the step that matters for subdirectories like
    # admin/: without it, try_files jumps straight from "is this a
    # literal file?" to the root index.html, never checking whether the
    # requested directory has its own index file to serve first — which
    # is exactly the bug that made /admin/ silently load the public
    # status page instead of the admin page (confirmed in testing,
    # 08-2026).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxmox API — forwarded internally to the proxy container
    location /proxmox/ {
        proxy_pass http://proxy:3001/proxmox/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Zabbix JSON-RPC — forwarded internally to the proxy container
    location /zabbix {
        proxy_pass http://proxy:3001/zabbix;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Prometheus API — forwarded internally to the proxy container
    location /prometheus/ {
        proxy_pass http://proxy:3001/prometheus/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Proxy health check, reachable through the same origin
    location /health {
        proxy_pass http://proxy:3001/health;
    }

    # Incident history — forwarded internally to the proxy container
    location /incidents {
        proxy_pass http://proxy:3001/incidents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Full-category history (Proxmox API / Zabbix snapshot poller) —
    # forwarded internally to the proxy container. Trailing-slash prefix
    # match, not an exact path, since /history/:serviceId has a dynamic
    # segment — same style as /proxmox/ and /prometheus/ above, not the
    # fixed-path style /incidents and /health use.
    location /history/ {
        proxy_pass http://proxy:3001/history/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Live-update nudge channel (SSE) — forwarded internally to the
    # proxy container. Needs real SSE-specific directives, not the
    # defaults the routes above use: buffering must be off or nginx
    # holds each event in its buffer instead of forwarding it
    # immediately (defeating the entire point of "near-instant"), and
    # the read timeout needs to be long since this connection is meant
    # to stay open indefinitely rather than time out like a normal
    # request.
    # Admin API routes (21-Manual Incident Authoring UI) — forwarded
    # internally to the proxy container. Scoped to /admin/incidents
    # specifically, NOT a bare /admin/ prefix — a broader rule here would
    # win nginx's longest-prefix-match over the generic `location /`
    # above and swallow the actual admin.html page request too, sending
    # it to Express (which has no route for a bare GET /admin/, only the
    # POST/PATCH /admin/incidents API) instead of letting it fall through
    # to static file serving. Confirmed as a real bug in testing
    # (08-2026) — the page returned Express's "Cannot GET /admin/"
    # instead of loading, before this was narrowed.
    location /admin/incidents {
        proxy_pass http://proxy:3001/admin/incidents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}