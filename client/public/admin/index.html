<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Homelab Status</title>
  <!--
    Standalone page, not a React route. The status page's own App.tsx has
    no router — adding one for exactly one admin page would be a real new
    dependency for a single screen. This matches the portfolio site's own
    established preference for plain HTML/JS over a framework wherever
    one isn't earned.

    Auth: this page assumes Cloudflare Access is gating the /admin/*
    path prefix at the edge. There is no login form here on purpose —
    if this page loaded at all, Access already decided you're allowed to
    see it. The fetch calls below carry no credentials of their own.
  -->
  <style>
    :root {
      --bg: #0e0d0b;
      --bg-raised: #151410;
      --border: #232220;
      --text: #f0ede8;
      --muted: #7a7670;
      --accent: #c8622a;
      --danger: #e05252;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem 4rem;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 2rem; }
    section {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0.75rem 0 0.25rem; }
    label:first-of-type { margin-top: 0; }
    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem 0.6rem;
      font-family: inherit;
      font-size: 0.9rem;
    }
    textarea { min-height: 4.5rem; resize: vertical; }
    button {
      margin-top: 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.danger { background: var(--danger); }
    .status-msg { font-size: 0.8rem; margin-top: 0.5rem; }
    .status-msg.ok { color: #4caf7d; }
    .status-msg.err { color: var(--danger); }
    .incident {
      border-top: 1px solid var(--border);
      padding: 0.9rem 0;
    }
    .incident:first-child { border-top: none; padding-top: 0; }
    .incident-title { font-weight: 500; font-size: 0.9rem; }
    .incident-meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    .incident-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
    .promote-instruction {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
      font-size: 0.8rem;
    }
    .promote-instruction strong { color: var(--accent); }
    .promote-instruction p { margin: 0.4rem 0 0.7rem; color: var(--text); }
    .incident-actions input {
      flex: 1;
    }
    .updates-toggle {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 0;
      margin-top: 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .updates-toggle:hover { color: var(--text); }
    .updates-toggle .chevron {
      display: inline-block;
      font-size: 0.7rem;
      transition: transform 0.15s;
    }
    .updates-toggle[aria-expanded="true"] .chevron { transform: rotate(90deg); }
    .incident-updates {
      list-style: none;
      margin: 0.5rem 0 0;
      padding: 0.5rem 0 0 0.9rem;
      border-left: 1px solid var(--border);
    }
    .incident-updates li { margin-bottom: 0.5rem; font-size: 0.75rem; }
    .incident-updates li:last-child { margin-bottom: 0; }
    .incident-updates time { color: var(--muted); }
    .incident-updates p { margin: 0.15rem 0 0; color: var(--text); }
    .tag {
      display: inline-block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.05rem 0.35rem;
      color: var(--muted);
      margin-left: 0.4rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Homelab Status — Admin</h1>
    <p class="subtitle">Create and update incidents directly, no git push required. See <a href="/" style="color: var(--muted)">the live page</a>.</p>

    <section>
      <h2>New Incident</h2>
      <label for="new-title">Title</label>
      <input id="new-title" type="text" placeholder="e.g. Planned maintenance — Murloc reboot" />

      <label for="new-services">Affected services (comma-separated service IDs)</label>
      <input id="new-services" type="text" placeholder="e.g. proxmox-murloc, vaultwarden" />

      <label for="new-message">Initial update</label>
      <textarea id="new-message" placeholder="What's happening, in plain terms."></textarea>

      <button id="create-btn" type="button">Create incident</button>
      <div id="create-status" class="status-msg"></div>
    </section>

    <section>
      <h2>Existing Incidents</h2>
      <div id="incident-list">Loading…</div>
    </section>
  </main>

  <script>
    // No VITE_PROXY_URL equivalent here — this is a plain static page,
    // not a Vite build, so it can't read import.meta.env. Relative paths
    // work the same way the client's own production build does: this
    // page and the /admin/incidents API are served from the same
    // single origin behind nginx, so no origin needs to be hardcoded.
    const API_BASE = '';

    async function loadIncidents() {
      const listEl = document.getElementById('incident-list');
      try {
        const res = await fetch(`${API_BASE}/incidents`);
        if (!res.ok) throw new Error(`${res.status}`);
        const incidents = await res.json();

        if (incidents.length === 0) {
          listEl.innerHTML = '<p class="subtitle">No incidents yet.</p>';
          return;
        }

        // Most recent first — same ordering the public client.ts adapter
        // imposes, so this list reads the same way the live page does.
        incidents.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        listEl.innerHTML = incidents.map(incident => `
          <div class="incident" data-id="${escapeAttr(incident.id)}" data-title="${escapeAttr(incident.title)}">
            <div class="incident-title">
              ${escapeHtml(incident.title)}
              <span class="tag">${escapeHtml(incident.status)}</span>
              <span class="tag">${escapeHtml(incident.source ?? 'manual')}</span>
            </div>
            <div class="incident-meta">${escapeHtml((incident.affectedServices || []).join(', '))}</div>
            ${(incident.updates && incident.updates.length > 0) ? `
              <button type="button" class="updates-toggle" aria-expanded="false">
                <span class="chevron">▸</span>
                ${incident.updates.length} update${incident.updates.length === 1 ? '' : 's'}
              </button>
              <ol class="incident-updates" hidden>
                ${incident.updates.map(update => `
                  <li>
                    <time>${escapeHtml(formatUpdateTimestamp(update.timestamp))}</time>
                    <p>${escapeHtml(update.message)}</p>
                  </li>
                `).join('')}
              </ol>
            ` : ''}
            <div class="incident-actions">
              ${incident.origin === 'file'
                ? `<span class="tag">File-backed</span>
                   <button type="button" class="secondary promote-btn">Promote to editable</button>`
                : `<input type="text" placeholder="Add an update…" class="update-input" />
                   <button type="button" class="secondary update-btn">Update</button>
                   ${incident.status !== 'resolved'
                     ? '<button type="button" class="danger resolve-btn">Resolve</button>'
                     : '<button type="button" class="danger delete-btn">Delete</button>'}`}
            </div>
          </div>
        `).join('');

        listEl.querySelectorAll('.update-btn').forEach(btn => {
          btn.addEventListener('click', () => handleUpdate(btn, false));
        });
        listEl.querySelectorAll('.resolve-btn').forEach(btn => {
          btn.addEventListener('click', () => handleUpdate(btn, true));
        });
        listEl.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', () => handleDelete(btn));
        });
        listEl.querySelectorAll('.promote-btn').forEach(btn => {
          btn.addEventListener('click', () => handlePromote(btn));
        });
        listEl.querySelectorAll('.updates-toggle').forEach(btn => {
          btn.addEventListener('click', () => toggleUpdates(btn));
        });
      } catch (err) {
        listEl.innerHTML = `<p class="status-msg err">Couldn't load incidents: ${escapeHtml(String(err))}</p>`;
      }
    }

    // Delete is only ever offered on already-resolved incidents (see the
    // template above), but the confirm() here is the real, deliberate
    // friction point — irreversible, no undo, and worth more than just
    // a click given real data loss is on the line.
    async function handleDelete(button) {
      const incidentEl = button.closest('.incident');
      const id = incidentEl.dataset.id;
      const title = incidentEl.dataset.title;

      if (!confirm(`Delete "${title}"? This can't be undone.`)) return;

      button.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/admin/incidents/${encodeURIComponent(id)}`, {
          method: 'DELETE',
        });

        if (res.status === 409) {
          // Shouldn't normally happen — this button only ever renders
          // for already-resolved incidents — but a real guard worth
          // surfacing honestly rather than a silent failure if the
          // status changed out from under this page some other way.
          alert("This incident isn't resolved — resolve it first before deleting.");
          button.disabled = false;
          return;
        }

        if (!res.ok) throw new Error(`${res.status}`);
        loadIncidents();
      } catch (err) {
        alert(`Delete failed: ${err}`);
        button.disabled = false;
      }
    }

    // Collapsed by default, unlike the public page's default-open for
    // active incidents — the real use case here is confirming a
    // specific incident's history on demand, not scanning current
    // outages, so keeping the list compact by default matters more
    // than surfacing everything at once. State isn't persisted across
    // a reload since loadIncidents() rebuilds the whole list fresh
    // every time; that's fine, nothing here needs to survive a refresh.
    function toggleUpdates(button) {
      const list = button.nextElementSibling;
      const isOpen = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', String(!isOpen));
      list.hidden = isOpen;
    }

    // The real manual follow-up here (removing the original file entry
    // by hand) is easy to miss if it's just an alert() someone dismisses
    // without reading. This renders as a persistent block in place of
    // the incident's own action buttons instead — it stays on screen
    // until explicitly acknowledged, since a promotion always needs a
    // real follow-up step and that step shouldn't be easy to lose track of.
    async function handlePromote(button) {
      const incidentEl = button.closest('.incident');
      const id = incidentEl.dataset.id;
      const title = incidentEl.dataset.title;

      if (!confirm(`Promote "${title}" to an editable database incident? You'll need to make one manual edit to incidents.json afterward — instructions will be shown here once this completes.`)) return;

      button.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/admin/incidents/${encodeURIComponent(id)}/promote`, {
          method: 'POST',
        });

        if (!res.ok) throw new Error(`${res.status}`);
        const { manualEditInstruction } = await res.json();

        const actionsEl = incidentEl.querySelector('.incident-actions');
        actionsEl.innerHTML = `
          <div class="promote-instruction">
            <strong>Manual follow-up required:</strong>
            <p>${escapeHtml(manualEditInstruction)}</p>
            <button type="button" class="secondary ack-btn">Got it — refresh list</button>
          </div>
        `;
        actionsEl.querySelector('.ack-btn').addEventListener('click', loadIncidents);
      } catch (err) {
        alert(`Promote failed: ${err}`);
        button.disabled = false;
      }
    }

    async function handleUpdate(button, resolving) {
      const incidentEl = button.closest('.incident');
      const id = incidentEl.dataset.id;
      const input = incidentEl.querySelector('.update-input');
      const message = resolving
        ? (input.value.trim() || 'Marked resolved.')
        : input.value.trim();

      if (!resolving && !message) {
        input.focus();
        return;
      }

      button.disabled = true;
      try {
        const body = resolving ? { message, status: 'resolved' } : { message };
        const res = await fetch(`${API_BASE}/admin/incidents/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (res.status === 404) {
          // This button only ever renders for db-backed incidents now
          // (file-backed ones show a Promote action instead). A 404
          // here means the incident was deleted, or genuinely does not
          // exist — a real, if rare, race worth explaining rather than
          // failing silently.
          alert("This incident no longer exists in the database — it may have just been deleted. Refresh the list to see current state.");
          button.disabled = false;
          return;
        }

        if (!res.ok) throw new Error(`${res.status}`);
        input.value = '';
        loadIncidents();
      } catch (err) {
        alert(`Update failed: ${err}`);
        button.disabled = false;
      }
    }

    document.getElementById('create-btn').addEventListener('click', async () => {
      const titleEl = document.getElementById('new-title');
      const servicesEl = document.getElementById('new-services');
      const messageEl = document.getElementById('new-message');
      const statusEl = document.getElementById('create-status');
      const btn = document.getElementById('create-btn');

      const title = titleEl.value.trim();
      const affectedServices = servicesEl.value.split(',').map(s => s.trim()).filter(Boolean);
      const message = messageEl.value.trim();

      if (!title || affectedServices.length === 0 || !message) {
        statusEl.textContent = 'Title, at least one affected service, and an initial message are all required.';
        statusEl.className = 'status-msg err';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = '';
      try {
        const res = await fetch(`${API_BASE}/admin/incidents`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, affectedServices, message }),
        });
        if (!res.ok) throw new Error(`${res.status}`);

        statusEl.textContent = 'Incident created.';
        statusEl.className = 'status-msg ok';
        titleEl.value = '';
        servicesEl.value = '';
        messageEl.value = '';
        loadIncidents();
      } catch (err) {
        statusEl.textContent = `Failed: ${err}`;
        statusEl.className = 'status-msg err';
      } finally {
        btn.disabled = false;
      }
    });

    // Same field set as the public page's own timestamp formatting —
    // month/day/hour/minute is enough precision for a status update,
    // full date+seconds would be more noise than signal here.
    function formatUpdateTimestamp(iso) {
      return new Date(iso).toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, '&quot;');
    }

    loadIncidents();
  </script>
</body>
</html>
