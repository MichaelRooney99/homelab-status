# Rate limiting — keyed on Cloudflare's own client-IP header, not
# nginx's default $binary_remote_addr, since every
# request here arrives via the Cloudflare tunnel and would otherwise all
# appear to share one source. General zone covers ordinary reads; a
# tighter zone specifically covers the admin write routes, since a real
# admin makes far fewer requests than a normal page load does — a
# single page load fires roughly 25-40 near-simultaneous requests
# (per-node Proxmox status, per-service history, live status, the SSE
# connection), which is why the general burst allowance below is sized
# generously rather than left at a typical small default — a too-tight
# burst would rate-limit legitimate visitors, not just abuse.
limit_req_zone $http_cf_connecting_ip zone=general_limit:10m rate=120r/m;
limit_req_zone $http_cf_connecting_ip zone=admin_limit:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=general_limit burst=60 nodelay;
    limit_req_status 429;

    # Security headers — set here, not via helmet.js on the Express
    # proxy. This is the single-origin architecture's actual
    # page-serving layer; a CSP
    # governs what the loaded *page* can do, and the proxy never serves
    # the HTML the browser renders — setting these headers there would
    # protect nothing. Server-level `add_header` here applies to every
    # location below that doesn't declare its own (all of them, in this
    # file), so this one place covers both the static page and every
    # proxied API/SSE/admin response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Deliberately permissive only where this app genuinely needs it,
    # not a generic lockdown copy-pasted from a template: script-src
    # allows 'unsafe-inline' for the anti-flash theme script that has to
    # run before any external file loads; style-src/font-src allow
    # Google Fonts specifically (fonts.googleapis.com/fonts.gstatic.com
    # — the actual @import this app's own CSS uses, nothing broader);
    # connect-src is 'self' only, since every fetch/EventSource call
    # this app makes is already same-origin by design. frame-ancestors
    # 'none' since nothing about this app was ever meant to be embedded
    # in someone else's page. This does NOT interfere with Cloudflare
    # Access's login flow — that's a full-page redirect to a completely
    # separate Cloudflare-hosted origin, never an iframe of this one, so
    # this CSP has no bearing on it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Static assets — SPA fallback in case client-side routing is added
    # later. $uri/ is the step that matters for subdirectories like
    # admin/: without it, try_files jumps straight from "is this a
    # literal file?" to the root index.html, never checking whether the
    # requested directory has its own index file to serve first — which
    # is exactly the bug that made /admin/ silently load the public
    # status page instead of the admin page (confirmed in testing,
    # 08-2026).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxmox API — forwarded internally to the proxy container
    location /proxmox/ {
        proxy_pass http://proxy:3001/proxmox/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Zabbix JSON-RPC — forwarded internally to the proxy container
    location /zabbix {
        proxy_pass http://proxy:3001/zabbix;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Prometheus API — forwarded internally to the proxy container
    location /prometheus/ {
        proxy_pass http://proxy:3001/prometheus/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Proxy health check, reachable through the same origin
    location /health {
        proxy_pass http://proxy:3001/health;
    }

    # Embeddable status badge — public, unauthenticated, forwarded
    # internally to the proxy container. Plain cached GET, no
    # SSE-style directives needed, same style as /health.
    location /badge.svg {
        proxy_pass http://proxy:3001/badge.svg;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Incident history — forwarded internally to the proxy container
    location /incidents {
        proxy_pass http://proxy:3001/incidents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Full-category history (Proxmox API / Zabbix snapshot poller) —
    # forwarded internally to the proxy container. Trailing-slash prefix
    # match, not an exact path, since /history/:serviceId has a dynamic
    # segment — same style as /proxmox/ and /prometheus/ above, not the
    # fixed-path style /incidents and /health use.
    location /history/ {
        proxy_pass http://proxy:3001/history/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Live-update nudge channel (SSE) — forwarded internally to the
    # proxy container. Needs real SSE-specific directives, not the
    # defaults the routes above use: buffering must be off or nginx
    # holds each event in its buffer instead of forwarding it
    # immediately (defeating the entire point of "near-instant"), and
    # the read timeout needs to be long since this connection is meant
    # to stay open indefinitely rather than time out like a normal
    # request. Confirmed missing in production via a direct curl —
    # requests to /events were falling through to the SPA fallback
    # below instead of reaching the proxy at all (a 200 with
    # content-type: text/html and a real last-modified header, the
    # tell that nginx served the static index.html rather than
    # proxying anything). The failure stayed invisible client-side
    # because EventSource's error handling is deliberately silent and
    # the app's own 60s polling fallback kept the page working anyway
    # — just without the instant nudge this route exists to provide.
    location /events {
        proxy_pass http://proxy:3001/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Clears the default "Connection: close" nginx would otherwise
        # send upstream, which would tear down the long-lived
        # connection immediately after the first byte.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # Default read timeout (60s) would silently kill this
        # connection well before any real gap in nudges — this
        # connection is meant to sit open indefinitely.
        proxy_read_timeout 24h;
    }

    # Admin API routes — forwarded internally to the proxy container.
    # Scoped to /admin/incidents
    # specifically, NOT a bare /admin/ prefix — a broader rule here would
    # win nginx's longest-prefix-match over the generic `location /`
    # above and swallow the actual admin.html page request too, sending
    # it to Express (which has no route for a bare GET /admin/, only the
    # POST/PATCH /admin/incidents API) instead of letting it fall through
    # to static file serving. Confirmed as a real bug in testing
    # (08-2026) — the page returned Express's "Cannot GET /admin/"
    # instead of loading, before this was narrowed.
    location /admin/incidents {
        # Overrides the server-level general_limit above — a real admin
        # makes deliberate, occasional write requests, not a page-load's
        # worth of parallel reads, so this can and should be tighter.
        limit_req zone=admin_limit burst=5 nodelay;
        proxy_pass http://proxy:3001/admin/incidents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
