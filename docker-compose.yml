services:
  client:
    build:
      # Was `.` — the client app now lives in its own subfolder, matching
      # proxy's sibling layout below. Keeps the two build contexts
      # symmetric and scoped independently, so neither service's build
      # can accidentally pull in the other's files.
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    env_file:
      - ./proxy/.env
    environment:
      - INCIDENTS_FILE_PATH=/data/incidents.json
      - SNAPSHOTS_DB_PATH=/data/snapshots/snapshots.db
    ports:
      - "3001:3001"
    volumes:
      - ./proxy/incidents.json:/data/incidents.json:ro
      - snapshots-data:/data/snapshots
    restart: unless-stopped

volumes:
  # Named volume, not a bind mount — snapshots.db is generated by the
  # app itself, there's no source file in the repo to mount the way
  # incidents.json is. This has to survive `docker compose up -d --build`
  # on every redeploy, or the whole point of accumulating history is
  # defeated the next time capstone_deploy.yml runs. Named volumes
  # persist across container recreation; only an explicit
  # `docker compose down -v` or `docker volume rm` would remove this.
  snapshots-data:
