name: CI/CD

# Runs on every push and every PR into main. CI (the client/proxy jobs
# below) runs for both pushes and PRs — everything they check needs
# nothing but a checked-out copy of the repo, zero secrets in GitHub's
# Secrets store, genuinely safe by construction. CD (trigger-deploy,
# at the bottom) is real now, but scoped narrowly on purpose: it only
# fires on an actual push to main, only after both CI jobs pass, and
# it doesn't deploy anything itself — it calls a Cloudflare
# Access–gated webhook that triggers ansible-playbook locally on
# infrastructure this project already trusts. GitHub's hosted runners
# still can't reach the homelab directly (the Cloudflare tunnel stays
# outbound-only, unchanged) — CD works around that by triggering,
# not by reaching in itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    # The client app lives in its own client/ subfolder, not the repo
    # root, so every step below needs to run relative to that path.
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Catches real TypeScript errors, not just test failures — this
      # is the same build step the actual Docker image runs, so a type
      # error that would break the real deploy fails here first instead.
      - run: npm run build

  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      # passWithNoTests in vitest.config.ts means this step succeeds
      # cleanly even before any proxy-side tests exist, and will pick
      # up real tests automatically as they're added — no workflow
      # change needed here.
      - run: npm test

  trigger-deploy:
    # `needs` alone already means this job only runs if BOTH client and
    # proxy succeeded — GitHub Actions skips a job entirely when
    # anything it needs failed, no separate check required for that
    # part. The `if` below adds the other real constraint: only an
    # actual push to main should ever trigger a deploy, never a PR
    # build (which runs the exact same CI jobs, on purpose, but has no
    # business redeploying anything).
    needs: [client, proxy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the deploy webhook
        # Cloudflare Access sits in front of this URL, gated by a
        # service-token policy (not the email-based Allow policy
        # /admin uses — GitHub Actions can't do an interactive login).
        # The two CF-Access-* headers below are exactly what
        # authenticates this request at Cloudflare's edge; the
        # receiver itself does zero independent auth, same pattern as
        # every other Access-gated route this project has built.
        # `-f` makes curl exit non-zero on an HTTP error response
        # (e.g. 409 if a deploy is already running, or 403 if the
        # service token is wrong), so a failed trigger shows up as a
        # real failed job here, not a silently-ignored curl call.
        run: |
          curl -sf -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}"
